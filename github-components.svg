<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        /* ========== RESET & BASE STYLES ========== */
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }

        body {
          font-family: 'Segoe UI', 'Fira Code', 'Inter', system-ui, -apple-system, sans-serif;
          background: linear-gradient(135deg, #0a0e17 0%, #0f131f 100%);
          color: #e6edf3;
          line-height: 1.5;
          padding: 2rem;
        }

        .github-container {
          max-width: 1200px;
          margin: 0 auto;
          width: 100%;
        }

        /* ========== TYPOGRAPHY ========== */
        h1, h2, h3 {
          font-weight: 600;
          letter-spacing: -0.02em;
        }

        h1 {
          font-size: 3.5rem;
          background: linear-gradient(135deg, #60a5fa, #c084fc);
          -webkit-background-clip: text;
          background-clip: text;
          color: transparent;
          margin-bottom: 0.5rem;
        }

        h2 {
          font-size: 1.8rem;
          margin-bottom: 1.5rem;
          position: relative;
          display: inline-block;
        }

        h2:after {
          content: '';
          position: absolute;
          bottom: -8px;
          left: 0;
          width: 60%;
          height: 3px;
          background: linear-gradient(90deg, #60a5fa, #c084fc);
          border-radius: 2px;
        }

        /* ========== GLASS MORPHISM CARDS ========== */
        .glass-card {
          background: rgba(18, 24, 38, 0.7);
          backdrop-filter: blur(10px);
          border-radius: 24px;
          border: 1px solid rgba(96, 165, 250, 0.2);
          padding: 1.8rem;
          transition: all 0.3s ease;
        }

        .glass-card:hover {
          border-color: rgba(96, 165, 250, 0.5);
          transform: translateY(-4px);
          box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.5);
        }

        /* ========== LAYOUT SYSTEM ========== */
        .hero-section {
          display: flex;
          justify-content: space-between;
          align-items: center;
          flex-wrap: wrap;
          gap: 2rem;
          margin-bottom: 3rem;
        }

        .hero-content {
          flex: 1;
        }

        .hero-stats {
          display: flex;
          gap: 1.5rem;
        }

        .stat-badge {
          background: rgba(96, 165, 250, 0.1);
          padding: 0.5rem 1rem;
          border-radius: 30px;
          font-size: 0.9rem;
          border: 1px solid rgba(96, 165, 250, 0.3);
        }

        .projects-grid, .skills-grid {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
          gap: 1.5rem;
          margin-bottom: 2rem;
        }

        .github-stats {
          display: flex;
          flex-wrap: wrap;
          justify-content: center;
          gap: 1.5rem;
          margin: 2rem 0;
        }

        .stats-card {
          background: rgba(18, 24, 38, 0.7);
          backdrop-filter: blur(10px);
          border-radius: 20px;
          padding: 1rem;
          text-align: center;
          border: 1px solid rgba(96, 165, 250, 0.2);
          transition: all 0.3s ease;
        }

        .stats-card:hover {
          transform: translateY(-4px);
          border-color: #60a5fa;
        }

        /* ========== SKILL TAGS ========== */
        .skill-tag {
          display: inline-block;
          background: linear-gradient(135deg, #1e293b, #0f172a);
          padding: 0.5rem 1rem;
          border-radius: 30px;
          font-size: 0.85rem;
          font-weight: 500;
          margin: 0.3rem;
          border: 1px solid rgba(96, 165, 250, 0.3);
          transition: all 0.2s;
        }

        .skill-tag:hover {
          border-color: #60a5fa;
          transform: scale(1.03);
        }

        /* ========== PROJECT CARDS ========== */
        .project-card {
          background: rgba(18, 24, 38, 0.7);
          backdrop-filter: blur(10px);
          border-radius: 20px;
          padding: 1.5rem;
          border-left: 4px solid #60a5fa;
        }

        .project-title {
          font-size: 1.4rem;
          font-weight: 600;
          color: #60a5fa;
          margin-bottom: 0.5rem;
        }

        .project-desc {
          color: #94a3b8;
          margin-bottom: 1rem;
          font-size: 0.9rem;
        }

        .tech-badge {
          background: #1e293b;
          padding: 0.2rem 0.7rem;
          border-radius: 20px;
          font-size: 0.75rem;
          display: inline-block;
          margin-right: 0.5rem;
        }

        /* ========== FOOTER ========== */
        .footer {
          text-align: center;
          padding: 2rem;
          margin-top: 2rem;
          border-top: 1px solid rgba(96, 165, 250, 0.2);
        }

        /* ========== RESPONSIVE DESIGN ========== */
        @media (max-width: 768px) {
          body { padding: 1rem; }
          h1 { font-size: 2.2rem; }
          .hero-section { flex-direction: column; text-align: center; }
          h2:after { left: 50%; transform: translateX(-50%); width: 80%; }
        }
      </style>

      <div class="github-container">
        <!-- Hero Section with Stats -->
        <div class="hero-section">
          <div class="hero-content">
            <h1>Nobody-555-111</h1>
            <p style="font-size: 1.2rem; color: #94a3b8; margin: 1rem 0;">
              Security Researcher & Exploit Developer
            </p>
            <p style="color: #cbd5e1; max-width: 500px;">
              Crafting tools for penetration testing and uncovering vulnerabilities.
            </p>
          </div>
          <div class="hero-stats">
            <div class="stat-badge">⚔️ Red Team</div>
            <div class="stat-badge">🐍 Python</div>
            <div class="stat-badge">⚙️ C++</div>
          </div>
        </div>

        <!-- Pinned Projects Section -->
        <div class="glass-card" style="margin-bottom: 2rem;">
          <h2>📌 Pinned Projects</h2>
          <div class="projects-grid">
            <div class="project-card">
              <div class="project-title">NetSpector</div>
              <div class="project-desc">Advanced network reconnaissance and device discovery framework.</div>
              <span class="tech-badge">Python</span>
              <span class="tech-badge">Scapy</span>
            </div>
            <div class="project-card">
              <div class="project-title">C++ Keylogger</div>
              <div class="project-desc">Educational keystroke simulation for security research.</div>
              <span class="tech-badge">C++</span>
              <span class="tech-badge">WinAPI</span>
            </div>
          </div>
        </div>

        <!-- Tech Stack Section -->
        <div class="glass-card" style="margin-bottom: 2rem;">
          <h2>🛠️ Tech Arsenal</h2>
          <div class="skills-grid">
            <div>
              <h3 style="font-size: 1.2rem; margin-bottom: 1rem;">Languages</h3>
              <span class="skill-tag">Python</span>
              <span class="skill-tag">C++</span>
              <span class="skill-tag">HTML5</span>
              <span class="skill-tag">CSS3</span>
            </div>
            <div>
              <h3 style="font-size: 1.2rem; margin-bottom: 1rem;">Environments</h3>
              <span class="skill-tag">Linux</span>
              <span class="skill-tag">Kali Linux</span>
              <span class="skill-tag">Windows</span>
            </div>
          </div>
        </div>

        <!-- GitHub Stats Section -->
        <div class="glass-card" style="margin-bottom: 2rem;">
          <h2>📊 GitHub Stats</h2>
          <div class="github-stats">
            <div class="stats-card">
              <img src="https://github-readme-stats.vercel.app/api?username=Nobody-555-111&show_icons=true&theme=tokyonight&hide_border=true&bg_color=0D1117&title_color=60a5fa&icon_color=c084fc&count_private=true" alt="GitHub Stats" width="100%" />
            </div>
            <div class="stats-card">
              <img src="https://github-readme-streak-stats.herokuapp.com/?user=Nobody-555-111&theme=tokyonight&hide_border=true&background=0D1117&stroke=60a5fa&ring=c084fc&fire=60a5fa&currStreakNum=ffffff" alt="GitHub Streak" width="100%" />
            </div>
          </div>
          <div style="text-align: center; margin-top: 1rem;">
            <img src="https://github-readme-activity-graph.vercel.app/graph?username=Nobody-555-111&theme=react-dark&bg_color=0D1117&hide_border=true&area=true&color=60a5fa&line=c084fc&point=ffffff" alt="Activity Graph" width="100%" />
          </div>
        </div>

        <!-- Profile Views Counter -->
        <div class="footer">
          <img src="https://komarev.com/ghpvc/?username=Nobody-555-111&label=PROFILE+VIEWS&color=60a5fa&style=for-the-badge" alt="Profile Views" />
          <p style="margin-top: 1rem; font-size: 0.8rem; color: #64748b;">
            Always pushing the boundaries of cybersecurity
          </p>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>

