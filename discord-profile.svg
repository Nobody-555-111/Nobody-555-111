<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blurpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5865F2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#404EED;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="spaceGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1E1F22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F1012;stop-opacity:1" />
    </linearGradient>
  </defs>
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,100..900;1,100..900&amp;display=swap');
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }
        body {
          background: #0F1012;
          font-family: 'Inter', 'gg sans', 'Noto Sans', system-ui, sans-serif;
          color: #DBDEE1;
          padding: 32px 24px;
          line-height: 1.5;
        }
        .discord-container {
          max-width: 1280px;
          margin: 0 auto;
        }
        /* Profile Header Section */
        .profile-header {
          background: linear-gradient(135deg, #111214, #1E1F22);
          border-radius: 20px;
          padding: 40px;
          margin-bottom: 24px;
          border: 1px solid rgba(255,255,255,0.05);
          box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        .profile-identity {
          display: flex;
          align-items: center;
          gap: 24px;
          flex-wrap: wrap;
        }
        .avatar-frame {
          background: #5865F2;
          border-radius: 50%;
          padding: 4px;
          box-shadow: 0 0 20px rgba(88,101,242,0.3);
        }
        .avatar {
          width: 100px;
          height: 100px;
          border-radius: 50%;
          background: #2B2D31;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 48px;
        }
        .user-info h1 {
          font-size: 36px;
          font-weight: 700;
          background: linear-gradient(135deg, #FFFFFF, #DBDEE1);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          margin-bottom: 8px;
        }
        .user-tag {
          color: #B5BAC1;
          font-size: 18px;
          margin-bottom: 16px;
        }
        .user-bio {
          background: rgba(255,255,255,0.05);
          padding: 12px 16px;
          border-radius: 12px;
          border-left: 3px solid #5865F2;
          font-size: 14px;
          max-width: 600px;
        }
        /* Stats Cards Section */
        .stats-grid {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
          gap: 20px;
          margin-bottom: 32px;
        }
        .stat-card {
          background: #1E1F22;
          border-radius: 16px;
          padding: 20px;
          transition: all 0.2s ease;
          border: 1px solid #2B2D31;
        }
        .stat-card:hover {
          border-color: #5865F2;
          transform: translateY(-2px);
        }
        .stat-title {
          font-size: 14px;
          text-transform: uppercase;
          letter-spacing: 1px;
          color: #949BA4;
          margin-bottom: 12px;
        }
        .stat-value {
          font-size: 28px;
          font-weight: 700;
          color: #FFFFFF;
        }
        /* Tech Badges Section */
        .section-title {
          font-size: 20px;
          font-weight: 600;
          margin-bottom: 20px;
          display: flex;
          align-items: center;
          gap: 12px;
        }
        .badge-container {
          display: flex;
          flex-wrap: wrap;
          gap: 12px;
          margin-bottom: 32px;
        }
        .tech-badge {
          background: #2B2D31;
          padding: 8px 20px;
          border-radius: 40px;
          font-size: 14px;
          font-weight: 500;
          transition: all 0.2s;
          border: 1px solid #3B3F45;
        }
        .tech-badge:hover {
          background: #5865F2;
          border-color: #7983F5;
          color: white;
        }
        /* Projects Section */
        .projects-grid {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
          gap: 24px;
          margin-bottom: 32px;
        }
        .project-card {
          background: #1E1F22;
          border-radius: 16px;
          padding: 24px;
          border: 1px solid #2B2D31;
          transition: all 0.2s;
        }
        .project-card:hover {
          border-color: #5865F2;
        }
        .project-name {
          font-size: 18px;
          font-weight: 600;
          color: #5865F2;
          margin-bottom: 12px;
        }
        .project-desc {
          font-size: 14px;
          color: #B5BAC1;
          margin-bottom: 20px;
          line-height: 1.5;
        }
        .project-tech {
          display: flex;
          gap: 12px;
          flex-wrap: wrap;
        }
        .project-tech span {
          background: #2B2D31;
          padding: 4px 12px;
          border-radius: 20px;
          font-size: 12px;
        }
        /* GitHub Stats Wrapper */
        .github-stats-wrapper {
          background: #1E1F22;
          border-radius: 16px;
          padding: 24px;
          margin-bottom: 32px;
          border: 1px solid #2B2D31;
        }
        .flex-stats {
          display: flex;
          flex-wrap: wrap;
          gap: 24px;
          justify-content: center;
          margin-top: 20px;
        }
        .flex-stats > div {
          flex: 1;
          min-width: 250px;
          text-align: center;
        }
        /* Footer */
        .footer {
          text-align: center;
          padding: 32px 20px;
          border-top: 1px solid #2B2D31;
          margin-top: 20px;
        }
        .status-banner {
          background: #111214;
          border-radius: 40px;
          padding: 8px 20px;
          display: inline-flex;
          align-items: center;
          gap: 8px;
          font-size: 14px;
          margin-bottom: 24px;
        }
        .status-dot {
          width: 10px;
          height: 10px;
          background: #23A55A;
          border-radius: 50%;
          display: inline-block;
        }
        @media (max-width: 768px) {
          body { padding: 16px; }
          .profile-header { padding: 24px; }
          .profile-identity { flex-direction: column; text-align: center; }
          .user-bio { margin: 0 auto; }
        }
      </style>
      <div class="discord-container">
        <!-- Header Section -->
        <div class="profile-header">
          <div class="profile-identity">
            <div class="avatar-frame">
              <div class="avatar">
                👤
              </div>
            </div>
            <div class="user-info">
              <h1>Nobody-555-111</h1>
              <div class="user-tag">@nobody_sec · Security Researcher</div>
              <div class="user-bio">
                🔐 Crafting advanced tools for penetration testing. 
                Python & C++ developer focused on offensive security and exploit development.
              </div>
            </div>
          </div>
        </div>

        <!-- Stats Cards -->
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-title">Open Source Contributions</div>
            <div class="stat-value">15+ Projects</div>
          </div>
          <div class="stat-card">
            <div class="stat-title">Tools Developed</div>
            <div class="stat-value">8 Security Tools</div>
          </div>
          <div class="stat-card">
            <div class="stat-title">Penetration Testing</div>
            <div class="stat-value">Expert Level</div>
          </div>
        </div>

        <!-- Tech Stack -->
        <div class="section-title">
          <span>🛠️</span> Tech Arsenal
        </div>
        <div class="badge-container">
          <span class="tech-badge">Python</span>
          <span class="tech-badge">C++</span>
          <span class="tech-badge">HTML5</span>
          <span class="tech-badge">CSS3</span>
          <span class="tech-badge">JavaScript</span>
          <span class="tech-badge">Kali Linux</span>
          <span class="tech-badge">Windows API</span>
          <span class="tech-badge">Network Protocols</span>
        </div>

        <!-- Projects Section -->
        <div class="section-title">
          <span>📌</span> Featured Security Projects
        </div>
        <div class="projects-grid">
          <div class="project-card">
            <div class="project-name">NetSpector</div>
            <div class="project-desc">Advanced network reconnaissance and device discovery framework for internal network analysis.</div>
            <div class="project-tech">
              <span>Python</span>
              <span>Scapy</span>
              <span>Network</span>
            </div>
          </div>
          <div class="project-card">
            <div class="project-name">C++ Keylogger Simulator</div>
            <div class="project-desc">Educational tool for understanding keystroke injection and input monitoring techniques.</div>
            <div class="project-tech">
              <span>C++</span>
              <span>Windows API</span>
              <span>Low-Level</span>
            </div>
          </div>
          <div class="project-card">
            <div class="project-name">Web Vulnerability Scanner</div>
            <div class="project-desc">Automated web application security scanner for detecting common vulnerabilities.</div>
            <div class="project-tech">
              <span>Python</span>
              <span>Requests</span>
              <span>Web Security</span>
            </div>
          </div>
        </div>

        <!-- GitHub Stats -->
        <div class="github-stats-wrapper">
          <div class="section-title" style="margin-bottom: 0;">
            <span>📊</span> GitHub Analytics
          </div>
          <div class="flex-stats">
            <div>
              <img src="https://github-readme-stats.vercel.app/api?username=Nobody-555-111&amp;show_icons=true&amp;theme=dark&amp;bg_color=1E1F22&amp;title_color=5865F2&amp;icon_color=5865F2&amp;border_color=2B2D31" width="100%" alt="GitHub Stats" />
            </div>
            <div>
              <img src="https://github-readme-streak-stats.herokuapp.com/?user=Nobody-555-111&amp;theme=dark&amp;background=1E1F22&amp;border=2B2D31&amp;ring=5865F2&amp;fire=5865F32&amp;currStreakNum=ffffff" width="100%" alt="GitHub Streak" />
            </div>
          </div>
          <div style="margin-top: 24px;">
            <img src="https://github-readme-activity-graph.vercel.app/graph?username=Nobody-555-111&amp;theme=github-dark&amp;bg_color=1E1F22&amp;color=5865F2&amp;line=404EED&amp;point=FFFFFF&amp;hide_border=true" width="100%" alt="GitHub Activity Graph" />
          </div>
        </div>

        <!-- Footer -->
        <div class="footer">
          <div class="status-banner">
            <span class="status-dot"></span>
            <span>Active in Security Research</span>
          </div>
          <div style="margin-top: 24px;">
            <img src="https://komarev.com/ghpvc/?username=Nobody-555-111&amp;label=Profile+Visitors&amp;color=5865F2&amp;style=flat-square" alt="Profile Views" />
          </div>
          <div style="margin-top: 16px; font-size: 12px; color: #949BA4;">
            Always pushing the boundaries of cybersecurity | Digital guardian
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
